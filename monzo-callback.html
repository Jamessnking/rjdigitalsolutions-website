<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK — Monzo Auth</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #2a2a2a; border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; text-align: center; }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p { color: #aaa; }
  .ok { color: #00e5a0; font-size: 3rem; }
</style>
</head>
<body>
<div class="card">
  <div class="ok" id="icon">⏳</div>
  <h1 id="title">Connecting to TK...</h1>
  <p id="msg">Forwarding your Monzo auth code. Please wait.</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const WEBHOOK = "https://webhook.site/a26ffd79-c044-428c-bc4c-43df563dea66";

  if (code) {
    fetch(WEBHOOK + "?code=" + encodeURIComponent(code), { mode: "no-cors" })
      .then(() => {
        document.getElementById("icon").textContent = "✅";
        document.getElementById("title").textContent = "Connected!";
        document.getElementById("msg").textContent = "TK has received the auth code. You can close this page.";
      })
      .catch(() => {
        document.getElementById("icon").textContent = "✅";
        document.getElementById("title").textContent = "Done — close this page.";
        document.getElementById("msg").textContent = "Auth code forwarded to TK.";
      });
  } else {
    document.getElementById("icon").textContent = "❌";
    document.getElementById("title").textContent = "No code found";
    document.getElementById("msg").textContent = "Try the auth link again.";
  }
</script>
</body>
</html>
