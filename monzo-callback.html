<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK — Monzo Auth</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .card { background: #2a2a2a; border-radius: 12px; padding: 32px; max-width: 600px; width: 100%; text-align: center; }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p { color: #aaa; margin-bottom: 24px; }
  .code-box { background: #111; border: 1px solid #444; border-radius: 8px; padding: 16px; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #00e5a0; text-align: left; margin-bottom: 16px; }
  .btn { background: #00e5a0; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<div class="card">
  <h1>TK — Monzo Connected</h1>
  <p id="status">Reading auth code...</p>
  <div class="code-box" id="code-display">Loading...</div>
  <button class="btn" onclick="copyCode()">Copy Code</button>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error");
  const display = document.getElementById("code-display");
  const status = document.getElementById("status");

  if (code) {
    status.textContent = "Auth code received — copy it and send to TK on WhatsApp.";
    display.textContent = code;
  } else if (error) {
    status.innerHTML = "<span class='error'>Error: " + error + "</span>";
    display.textContent = "Something went wrong. Try the auth link again.";
  } else {
    status.textContent = "No code found. Did you arrive here directly?";
    display.textContent = "Visit the Monzo auth URL first.";
  }

  function copyCode() {
    if (code) {
      navigator.clipboard.writeText(code).then(() => {
        document.querySelector(".btn").textContent = "Copied!";
        setTimeout(() => document.querySelector(".btn").textContent = "Copy Code", 2000);
      });
    }
  }
</script>
</body>
</html>
